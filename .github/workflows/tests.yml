name: Tests

on:
  push:
    branches:
      - main
      - inicial
      - refactor/folder-structure
  pull_request:
    branches:
      - main
      - inicial

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: "${{ github.workspace }}/backend"
      DJANGO_SETTINGS_MODULE: "settings.test"
      DB_ENGINE: "postgis"
      TEST_DB_ENGINE: "postgis"
      DB_NAME: "app"
      DB_USER: "app"
      DB_PASSWORD: "app"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      GDAL_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu/libgdal.so"
      GEOS_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu/libgeos_c.so"
      PROJ_LIB: "/usr/share/proj"
      PGPASSWORD: "app"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages (GDAL/GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Wait for PostGIS service
        run: |
          for i in {1..30}; do
            if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run migrations
        working-directory: backend
        run: |
          python manage.py migrate --noinput

      - name: Run GIS system checks
        working-directory: backend
        run: |
          python manage.py check --tag gis

      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage run -m pytest -q
          # EV-0006: com TODAS as apps medidas a cobertura real é 51 % (2026-10-04).
          # O «60 %» antigo media só core/maps_view/setup_app. Limiar honesto,
          # a subir (ratchet) à medida que os itens EV- acrescentam testes.
          # 2026-10-04 EV-0008: 52 % medidos → limiar 51; EV-0015: 53 % → 52; EV-0023: 54 % → 53.
          coverage report --show-missing --fail-under=58
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: error

  backend-lint:
    # EV-0022: lint só dos .py alterados face à base (a árvore inteira nunca passou;
    # a regra do projeto é «lint limpo nos ficheiros tocados»). Mesmo script que
    # `make lint-changed` corre localmente.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint tools
        run: pip install black==24.8.0 ruff==0.6.9 isort==5.13.2

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: black / isort / ruff on changed files
        run: scripts/lint-changed.sh "${{ steps.base.outputs.ref }}"

  frontend-lint:
    # EV-0022: o ESLint passa a zero erros e fica a guardar isso.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

  frontend-unit:
    # Espelha o job `test-front` do CRM.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests (Vitest)
        run: npm run test:unit
