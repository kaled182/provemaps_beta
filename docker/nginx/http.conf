# http.conf — HTTP puro (sem SSL)
# Usado quando DOMAIN_NAME não está configurado, ou como bootstrap
# para o desafio ACME antes de emitir o certificado.

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Desafio ACME (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket (Django Channels) — sem o upgrade o browser recebe «connection failed»
    # e o mapa cai no polling de 60 s (EV-0042). O template HTTPS já o fazia.
    location /ws/ {
        proxy_pass         http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy para Django
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
