# http.conf — HTTP puro (sem SSL)
# Usado quando DOMAIN_NAME não está configurado, ou como bootstrap
# para o desafio ACME antes de emitir o certificado.

# EV-0069: resolver o nome «web» em tempo de execução (DNS interno do Docker).
# Com «proxy_pass http://web:8000» o nginx resolvia só no arranque: quando o web
# era recriado com outro IP (deploy), ficava a mandar para o antigo → 502 em tudo
# até reiniciar o nginx. Com variável + resolver, volta a resolver a cada 10 s.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    set $django_upstream http://web:8000;  # EV-0069: resolvido em runtime
    server_name _;

    client_max_body_size 100M;

    # Desafio ACME (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket (Django Channels) — sem o upgrade o browser recebe «connection failed»
    # e o mapa cai no polling de 60 s (EV-0042). O template HTTPS já o fazia.
    location /ws/ {
        proxy_pass         $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy para Django
    location / {
        proxy_pass         $django_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
