# pyproject.toml - unified configuration for mapsprovefiber

[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | migrations
  | staticfiles
  | media
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = ["core", "maps_view", "setup_app"]
skip_glob = ["migrations/*", "**/templates/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "migrations",
    "**/templates/**",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # PyFlakes
    "I",   # Isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # Pylint
    "DJ",  # Django
    "RUF", # Ruff-specific
]
ignore = [
    "E501",   # line-too-long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "PLR2004", # magic value used in comparison
    "DJ008",  # jQuery is not available in Django
    # EV-0022 (2026-10-04): o lint passa a correr no CI sobre os ficheiros alterados.
    # Estas regras tinham 119 achados pré-existentes concentrados nos god-modules
    # (setup_app/api_views.py, usecases/devices.py, viewsets.py — EV-0017) e
    # exigem refatoração, não formatação. Voltam a entrar quando o EV-0017 fatiar
    # esses ficheiros (ratchet: medir, reativar uma regra, corrigir o resto).
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    # Idioma Django/DRF: `permission_classes = [...]`, `Meta.fields = [...]`,
    # `EXEMPT_PATHS = [...]` em middleware. Anotar tudo com ClassVar não acrescenta nada.
    "RUF012",  # mutable-class-default
    # `CharField(null=True)` pré-existente em vários modelos; corrigir é migração de
    # dados (NULL → ""), não lint. Entra como item EV- próprio quando se mexer nos modelos.
    "DJ001",   # django-nullable-model-string-field
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
# Mesmas escolhas do [tool.isort] acima, senão `isort --check` e `ruff I001` discordam.
combine-as-imports = true
known-first-party = ["core", "maps_view", "setup_app", "inventory", "integrations", "monitoring", "service_accounts", "telemetry", "gpon", "dwdm", "settings"]

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
disallow_incomplete_defs = true
exclude = [
    'migrations/',
    'tests/',
    '.*_test\.py',
    '^settings/.*',
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "celery.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# EV-0006: medir TODAS as apps de primeira parte. Até 2026-10-04 só core,
# maps_view e setup_app contavam — inventory (a maior app), integrations,
# monitoring e service_accounts ficavam fora do «60 %» que o CI exigia.
source = [
    "core",
    "maps_view",
    "setup_app",
    "inventory",
    "integrations",
    "monitoring",
    "service_accounts",
    "telemetry",
    "gpon",
    "dwdm",
]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/settings/*",
    "*/__init__.py",
    "*/tests.py",
    "*/tests_*.py",
    "*/management/commands/*",
    "*/asgi.py",
    "*/wsgi.py",
    "*/celery_app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "class .*:\\.\\.\\.",
]

# A configuração do pytest vive em backend/pytest.ini (espelhada em ../pytest.ini).
# A secção [tool.pytest.ini_options] que existia aqui era ignorada: pytest.ini prevalece.
